version: '3.8'

services:
  tft-model-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: tft-model-server:latest
    container_name: tft-model-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Mount the models directory to persist trained models
      - ./models:/app/models
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      # Database connection settings
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=backtest_user
      - DB_PASSWORD=backtest_password
      - DB_NAME=backtest_db
      # Flask settings
      - FLASK_ENV=production
      # Model settings
      - DATA_REFRESH_INTERVAL=300  # in seconds (5 minutes)
    depends_on:
      - postgres

  postgres:
    image: postgres:14
    container_name: tft-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=backtest_user
      - POSTGRES_PASSWORD=backtest_password
      - POSTGRES_DB=backtest_db
    ports:
      - "5438:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Optional: Mount initialization scripts
      # - ./db_init:/docker-entrypoint-initdb.d

  # Optional: Add a UI container for monitoring the model
  tft-model-monitor:
    image: nginx:alpine
    container_name: tft-model-monitor
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./monitor:/usr/share/nginx/html
    depends_on:
      - tft-model-server

  # Optional: Add Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: tft-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - tft-model-server

  # Optional: Add Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: tft-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data: 